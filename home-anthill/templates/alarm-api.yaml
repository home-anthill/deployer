---
apiVersion: v1
kind: Secret
metadata:
  name: alarm-api-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  .env: |-
    LOG_LEVEL=info
    ONLINE_REDIS_URI=redis://{{ .Values.redis.serviceName }}.{{ .Values.namespace }}.svc.cluster.local:6379/0
    NOTIFICATIONS_REDIS_URI=redis://{{ .Values.redis.serviceName }}.{{ .Values.namespace }}.svc.cluster.local:6379/1
    ALARMS_REDIS_URI=redis://{{ .Values.redis.serviceName }}.{{ .Values.namespace }}.svc.cluster.local:6379/3
    REDIS_USERNAME={{ .Values.redis.username }}
    REDIS_PASSWORD={{ .Values.redis.password }}
  Rocket.toml: |-
    [default]

    [release]
    address = "0.0.0.0"
    port = 80
    secret_key="{{ .Values.alarmApi.rocketSecretKey.release }}"
    limits = { json = "8 KiB" }
    cli_colors = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarm-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alarm-api
  template:
    metadata:
      labels:
        app: alarm-api
    spec:
      {{- if .Values.serviceAccounts.enabled }}
      serviceAccountName: alarm-api
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alarm-api
        image: {{ .Values.alarmApi.image }}
        {{- if .Values.debug.pods.alwaysPullContainers }}
        imagePullPolicy: Always
        {{- end }}
        {{- if .Values.debug.pods.sleepInfinity }}
        command: ["/bin/sh"]
        args: ["-c", "chmod +x /app/alarm-api; /app/alarm-api; sleep Infinity;"]
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
        resources:
          {{- toYaml .Values.alarmApi.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /keepalive
            port: http
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /keepalive
            port: http
          periodSeconds: 60
          failureThreshold: 2
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: alarm-api-secret
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        - name: alarm-api-secret
          mountPath: /app/Rocket.toml
          subPath: Rocket.toml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: alarm-api-secret
        secret:
          secretName: alarm-api-secret
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Values.alarmApi.serviceName }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: alarm-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
