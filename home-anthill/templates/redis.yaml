---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  redis.conf: |-
    # Enable Redis persistence on the mounted /data volume.
    # RDB snapshots are enough for this deployment; AOF is left off to keep
    # writes smaller and simpler on a single-node k3s setup.
    save 900 1
    save 300 10
    save 60 10000
    # Keep protected mode enabled; in-cluster access is still allowed through
    # the Service and authenticated ACL users, while accidental external access
    # stays blocked by Redis itself.
    protected-mode yes
    appendonly no
    bind 0.0.0.0
    user {{ .Values.redis.username }} on >{{ .Values.redis.password }} ~* +@all
    user default off
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      {{- if .Values.serviceAccounts.enabled }}
      serviceAccountName: redis
      automountServiceAccountToken: false
      {{- end }}
      {{- if .Values.dhi.enabled }}
      imagePullSecrets:
        - name: dhi-registry-secret
      {{- end }}
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: {{ if .Values.dhi.enabled }}{{ .Values.redis.hardenedImage }}{{ else }}{{ .Values.redis.image }}{{ end }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: redis-port
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: redis-port
          periodSeconds: 60
        # start redis with a custom redis.conf file
        command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
        ports:
        - name: "redis-port"
          containerPort: 6379
          protocol: TCP
        volumeMounts:
          - name: data
            mountPath: "/data"
          - name: redis-secret
            mountPath: /usr/local/etc/redis/redis.conf
            subPath: redis.conf
            readOnly: true
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data-claim
        - name: redis-secret
          secret:
            secretName: redis-secret
        - name: tmp
          emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Values.redis.serviceName }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: redis
  ports:
    - name: redis-port
      protocol: TCP
      port: 6379
      targetPort: redis-port
