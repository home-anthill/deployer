---
apiVersion: v1
kind: Secret
metadata:
  name: alarm-notifier-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  .env: |-
    LOG_LEVEL=debug
    ONLINE_REDIS_URI=redis://{{ .Values.redis.serviceName }}.{{ .Values.namespace }}.svc.cluster.local:6379/0
    NOTIFICATIONS_REDIS_URI=redis://{{ .Values.redis.serviceName }}.{{ .Values.namespace }}.svc.cluster.local:6379/1
    ALARMS_REDIS_URI=redis://{{ .Values.redis.serviceName }}.{{ .Values.namespace }}.svc.cluster.local:6379/3
    REDIS_USERNAME={{ .Values.redis.username }}
    REDIS_PASSWORD={{ .Values.redis.password }}
    CACHE_TIMEOUT_SECONDS=120
    OFFLINE_TIMEOUT_SECONDS=60
    FCM_SERVICE_ACCOUNT_KEY_PATH=./serviceAccountKey.json
  Rocket.toml: |-
    [default]

    [release]
    address = "0.0.0.0"
    port = 80
    secret_key="{{ .Values.alarmNotifier.rocketSecretKey.release }}"
  serviceAccountKey.json: {{ .Values.alarmNotifier.firebaseServiceAccount | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarm-notifier
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alarm-notifier
  template:
    metadata:
      labels:
        app: alarm-notifier
    spec:
      {{- if .Values.serviceAccounts.enabled }}
      serviceAccountName: alarm-notifier
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alarm-notifier
        image: {{ .Values.alarmNotifier.image }}
        {{- if .Values.debug.pods.alwaysPullContainers }}
        imagePullPolicy: Always
        {{- end }}
        {{- if .Values.debug.pods.sleepInfinity }}
        command: ["/bin/sh"]
        args: ["-c", "chmod +x /app/alarm-notifier; /app/alarm-notifier; sleep Infinity;"]
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
        resources:
          {{- toYaml .Values.alarmNotifier.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /keepalive
            port: http
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /keepalive
            port: http
          periodSeconds: 60
          failureThreshold: 2
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: alarm-notifier-secret
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        - name: alarm-notifier-secret
          mountPath: /app/Rocket.toml
          subPath: Rocket.toml
          readOnly: true
        - name: alarm-notifier-secret
          mountPath: /app/serviceAccountKey.json
          subPath: serviceAccountKey.json
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: alarm-notifier-secret
        secret:
          secretName: alarm-notifier-secret
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
